name: Build Windows release

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_prerelease:
        description: Publish a clearly labeled migration-test prerelease
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  machine-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build:desktop
      - uses: actions/upload-artifact@v4
        with:
          name: text-jellyfin-v0.10.0-machine-installer
          path: |
            dist/Text-Jellyfin-Machine-Setup-0.10.0.exe
            dist/machine.yml
            dist/*.blockmap
          if-no-files-found: error

  publish-prerelease:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_prerelease
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build:desktop:publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
